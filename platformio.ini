 ;PlatformIO Project Configuration File

;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
 [common]
 default_envs = yolo_uno

 [env:yolo_uno]
 platform = espressif32
 board = yolo_uno
 framework = arduino
 build_unflags = -Os
 build_flags =
     -O1
     -include project_config.h
     -DARDUINO_USB_CDC_ON_BOOT=1
 lib_deps = 

 lib_extra_dirs =
     lib
     lib/Utils
     lib/ArduinoHttpClient
     lib/ArduinoJson
     lib/AsyncTCP
     lib/DHT20
     lib/ESPAsyncWebServer
     lib/TBPubSubClient
     lib/ThingsBoard
 lib_ldf_mode = deep  # Ensures that dependencies are correctly resolved
 board_build.filesystem = spiffs
 board_build.partitions = yolo_uno_8MB.csv
 monitor_port = COM3
 monitor_speed = 115200

 [env:M5_Atom_Dev]
 platform = espressif32
 board = m5stack-atom
 framework = arduino
 build_unflags = -Os
 build_flags =
     -O1
     -include project_config.h

 lib_deps = 
    adafruit/DHT sensor library@^1.4.6
 lib_extra_dirs =
     lib
     lib/Utils
 lib_ldf_mode = deep  # Ensures that dependencies are correctly resolved
 monitor_speed = 115200

 [env:wemos_d1_uno32]
 platform = espressif32
 framework = arduino
 board = wemos_d1_uno32
 build_unflags = -Os
 build_flags =
     -O1
     -include project_config.h

 lib_deps = 
    adafruit/DHT sensor library@^1.4.6

 lib_extra_dirs =
     lib
     lib/Utils
 lib_ldf_mode = deep  # Ensures that dependencies are correctly resolved
 monitor_speed = 115200

[env:esp32-s3-devkitc-1-n16r8v]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8v
framework = arduino
monitor_speed = 115200
lib_deps = 
	robtillaart/DHT20@^0.3.1
	adafruit/DHT sensor library@^1.4.6
	thingsboard/ThingsBoard@^0.15.0
	WiFi@2.0.0
	adafruit/DHT sensor library@^1.4.6
lib_extra_dirs =
    lib
    lib/Utils
    lib/ArduinoHttpClient
    lib/ArduinoJson
    lib/AsyncTCP
    lib/DHT20
    lib/ESPAsyncWebServer
    lib/TBPubSubClient
    lib/ThingsBoard